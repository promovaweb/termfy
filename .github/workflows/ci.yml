name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validar:
    name: Validar skills e ebook
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Instalar ferramentas de conferência do ebook
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils poppler-utils unzip

      - name: Validar
        run: bun run skills:validate && bun run ebook:verify

  compatibilidade:
    name: Conferir compatibilidade com o starter kit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: termfy
    env:
      STARTER_KIT_TOKEN: ${{ secrets.STARTER_KIT_TOKEN }}
    steps:
      - name: Conferir acesso ao starter kit
        id: acesso
        working-directory: .
        run: |
          if [ -n "$STARTER_KIT_TOKEN" ]; then
            echo "disponivel=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Secret STARTER_KIT_TOKEN ausente; a conferência com o starter kit privado foi pulada. Rode bun run skills:check-paths localmente."
            echo "disponivel=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Obter framework
        if: steps.acesso.outputs.disponivel == 'true'
        uses: actions/checkout@v4
        with:
          path: termfy

      - name: Obter starter kit
        if: steps.acesso.outputs.disponivel == 'true'
        uses: actions/checkout@v4
        with:
          repository: promovaweb/termfy-starter-kit
          token: ${{ secrets.STARTER_KIT_TOKEN }}
          path: termfy-starter-kit
          persist-credentials: false

      - name: Configurar Bun
        if: steps.acesso.outputs.disponivel == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Testar checagem de compatibilidade
        if: steps.acesso.outputs.disponivel == 'true'
        run: bun test scripts/check-skills-against-starter-kit.test.ts

      - name: Conferir caminhos e scripts
        if: steps.acesso.outputs.disponivel == 'true'
        run: bun run skills:check-paths ../termfy-starter-kit
