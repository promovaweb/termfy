name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publicar release com o ebook
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Instalar ferramentas de conferência do ebook
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils poppler-utils unzip

      - name: Validar
        run: bun run skills:validate && bun run ebook:verify

      - name: Extrair notas do changelog
        run: |
          versao="${GITHUB_REF_NAME#v}"
          awk -v v="$versao" '
            $0 ~ "^## \\[" v "\\]" { imprimir = 1; next }
            /^## \[/ { if (imprimir) exit }
            imprimir { print }
          ' CHANGELOG.md > notas.md
          test -s notas.md || echo "Release ${GITHUB_REF_NAME}." > notas.md

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: notas.md
          files: |
            ebook/ebook-termfy.pdf
            ebook/ebook-termfy.epub
            ebook/build.json
